<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise SSO Login | NutriPaws Enterprise</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <!-- Header -->
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <span>NutriPaws <span class="logo-badge">ENTERPRISE</span></span>
      </a>
      <div>
        <button class="icon-btn" data-theme-toggle title="Dark/Light Mode">🌙</button>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: grid; place-items: center; padding: 40px 20px;">
    <div class="card" style="width: min(480px, 100%); padding: 36px; border-color: var(--border-medium);">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="badge badge-emerald" style="margin-bottom: 10px;">Enterprise Single Sign-On</span>
        <h2 style="font-size: 1.6rem; font-weight: 800;">Sign in to NutriPaws Hub</h2>
        <p style="font-size: 0.86rem; color: var(--text-secondary); margin-top: 6px;">Access your formulation IP vault, sponsorship matches, and team seats.</p>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">Corporate Email (Okta / Azure AD / Google)</label>
          <input type="email" class="form-control" value="e.vance@apexpetnutrition.com" required />
        </div>

        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">Enterprise Password</label>
          <input type="password" class="form-control" value="••••••••••••" required />
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.84rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--brand-emerald);" />
            <span>Remember device</span>
          </label>
          <a href="#" style="color: var(--brand-primary);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 14px;">
          Sign In with Enterprise SSO ➔
        </button>

        <a class="btn btn-secondary" style="width: 100%;" href="register.html">
          Register New Enterprise Account
        </a>
      </form>
    </div>
  </main>

  <div class="toast-container"></div>
  <script src="app.js"></script>
</body>

</html>
